name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: S.BR-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish to public Release (download page)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/*.apk "S.BR.apk"
          gh release create "$TAG" "S.BR.apk" \
            --title "S.BR Android ${GITHUB_RUN_NUMBER}" \
            --notes "Otomatik derleme. Commit: ${GITHUB_SHA}" \
            --latest
